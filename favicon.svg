<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#090B16"/>
  <!-- Thin-line spider web radial strands -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="#F3F1EA" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="2" y1="16" x2="30" y2="16" stroke="#F3F1EA" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="6" y1="6" x2="26" y2="26" stroke="#F3F1EA" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="6" y1="26" x2="26" y2="6" stroke="#F3F1EA" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Web spiral polygons -->
  <polygon points="16,8 21.6,10.4 24,16 21.6,21.6 16,24 10.4,21.6 8,16 10.4,10.4" fill="none" stroke="#F3F1EA" stroke-width="0.8" stroke-opacity="0.6"/>
  <polygon points="16,4 24.5,7.5 28,16 24.5,24.5 16,28 7.5,24.5 4,16 7.5,7.5" fill="none" stroke="#F3F1EA" stroke-width="0.8" stroke-opacity="0.4"/>
  <!-- Central Red Spider Bead -->
  <circle cx="16" cy="16" r="3.2" fill="#E23636"/>
  <circle cx="16" cy="16" r="1.2" fill="#F3F1EA"/>
</svg>

